name: Запуск APK на эмуляторе
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: ID успешной целевой сборки APK ASTRA
        required: true
        type: string
      previous_run:
        description: ID успешной предыдущей сборки для проверки обновления поверх неё
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Скачать опубликованные APK из этого репозитория
        env:
          RUN_ID: ${{ inputs.build_run }}
          PREVIOUS_ID: ${{ inputs.previous_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download() {
            local id=$1 out=$2
            [[ "$id" =~ ^[0-9]+$ ]]
            meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")
            jq -e '.status=="completed" and .conclusion=="success" and .head_branch=="main" and .path==".github/workflows/build.yml"' <<< "$meta" >/dev/null
            number=$(jq -r '.run_number' <<< "$meta")
            echo "Используется APK сборки №$number (run $id)"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "scheduler-astra-$number" --dir "$out"
            test -s "$out/app-debug.apk"
            printf '%s\n' "$number" > "$out/number"
          }
          download "$RUN_ID" "$RUNNER_TEMP/app"
          if [[ -n "$PREVIOUS_ID" ]]; then
            download "$PREVIOUS_ID" "$RUNNER_TEMP/previous"
            test "$(cat "$RUNNER_TEMP/previous/number")" -lt "$(cat "$RUNNER_TEMP/app/number")"
          fi
      - name: Установить и проверить APK на Android 35
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd -n astra-test -k 'system-images;android-35;google_apis;x86_64' --force >/dev/null
          sudo chmod a+rw /dev/kvm
          emulator -avd astra-test -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          export ANDROID_SERIAL=emulator-5554
          timeout 300 bash -c 'until [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb shell wm dismiss-keyguard
          if [[ -s "$RUNNER_TEMP/previous/app-debug.apk" ]]; then
            adb install "$RUNNER_TEMP/previous/app-debug.apk"
            python3 .github/scripts/check_ui.py seed
            adb install -r "$RUNNER_TEMP/app/app-debug.apk"
          else
            adb install "$RUNNER_TEMP/app/app-debug.apk"
            python3 .github/scripts/check_ui.py seed
          fi
          python3 .github/scripts/check_ui.py verify
          echo 'Проверено: запуск, добавление дела, сохранение в базе и повторное открытие карточки после перезапуска/обновления.' >> "$GITHUB_STEP_SUMMARY"
