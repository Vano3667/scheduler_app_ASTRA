name: Сборка APK ASTRA
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APK: app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Временно восстановить ключ подписи ASTRA
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.ASTRA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${SIGNING_PASSWORD:?Не задан секрет ASTRA_SIGNING_PASSWORD}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --output keystore/debug.keystore --decrypt keystore/debug.keystore.gpg 3<<<"$SIGNING_PASSWORD"
          keytool -exportcert -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/astra.der"
      - name: Модульные тесты и APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Удалить временную копию закрытого ключа
        if: always()
        run: rm -f keystore/debug.keystore
      - name: Проверить комплект Android SDK и файл APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK" || { echo 'Не найден выходной файл APK'; exit 1; }
          tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -printf '%h\n' | sort -V | tail -1)
          test -x "$tools/apksigner" && test -r "$tools/lib/apksigner.jar" && test -x "$tools/aapt2" || { echo 'Неполные Android Build Tools'; exit 1; }
          echo "BUILD_TOOLS=$tools" >> "$GITHUB_ENV"
      - name: Проверить криптографическую подпись APK
        run: '"$BUILD_TOOLS/apksigner" verify --verbose "$APK"'
      - name: Сравнить двоичные сертификаты APK и ASTRA
        run: java -cp "$BUILD_TOOLS/lib/apksigner.jar" .github/scripts/VerifySigner.java "$APK" "$RUNNER_TEMP/astra.der"
      - name: Проверить идентификатор, SDK и разрешения упакованного манифеста
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          python3 - <<'PY'
          import re, os, pathlib
          text=pathlib.Path(os.environ['RUNNER_TEMP'],'badging.txt').read_text()
          package=re.search(r'^package:\s*(.*)$',text,re.M)
          attrs=dict(re.findall(r"(\w+)='([^']*)'",package.group(1))) if package else {}
          assert attrs.get('name')=='ru.dayplanner.astra' and attrs.get('versionCode')==os.environ['GITHUB_RUN_NUMBER'], f'Неверный пакет или версия: {attrs}'
          for label,expected in [('sdkVersion','29'),('targetSdkVersion','37')]:
              match=re.search(rf"^{label}:\s*'?(\d+)'?\s*$",text,re.M)
              assert match and match[1]==expected, f'Не совпало {label}: {match}'
          perms=set(re.findall(r"^uses-permission[^:]*:\s*name='([^']+)'",text,re.M))
          assert 'android.permission.RECEIVE_BOOT_COMPLETED' in perms, 'Не удалось прочитать разрешения манифеста'
          blocked={'android.permission.'+s for s in ['INTERNET','CAMERA','READ_MEDIA_IMAGES','READ_EXTERNAL_STORAGE','WRITE_EXTERNAL_STORAGE']}
          assert not perms & blocked, f'Лишние разрешения: {perms & blocked}'
          print('Манифест проверен: ru.dayplanner.astra, minSdk 29, targetSdk 37. Сетевых разрешений нет.')
          PY
      - name: Проверить отчёты тестов
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          n=sum(int(s.get('tests','0')) for s in suites)
          assert n and not any(int(s.get(k,'0')) for s in suites for k in ('errors','failures','skipped')), 'Неполный или неуспешный набор тестов'
          note=f'Модульных тестов пройдено: {n}. Подпись и манифест проверены.'
          print(note)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: print(note,file=f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-astra-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ github.run_number }}
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
