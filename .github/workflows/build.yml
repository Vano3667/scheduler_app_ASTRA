name: Сборка APK ASTRA
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.github/workflows/bootstrap.yml']
  workflow_run:
    workflows: ['Инициализация ASTRA']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Временно восстановить ключ подписи ASTRA
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.ASTRA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${SIGNING_PASSWORD:?Не задан секрет ASTRA_SIGNING_PASSWORD}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --output keystore/debug.keystore --decrypt keystore/debug.keystore.gpg 3<<<"$SIGNING_PASSWORD"
          test -s gradle/wrapper/gradle-wrapper.jar
      - name: Модульные тесты и APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Проверить APK, сертификат, версию, отсутствие сетевых разрешений и число тестов
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1 | xargs dirname)
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
          expected=$(keytool -exportcert -keystore keystore/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          grep -Fxi "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/cert.txt"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='ru.dayplanner.astra' versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/badging.txt"
          grep -Fx "sdkVersion:'29'" "$RUNNER_TEMP/badging.txt"
          grep -Fx "targetSdkVersion:'37'" "$RUNNER_TEMP/badging.txt"
          if grep -E "uses-permission[^:]*: name='android.permission.(INTERNET|CAMERA|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'" "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          n=sum(int(s.get('tests','0')) for s in suites)
          assert n and not any(int(s.get(k,'0')) for s in suites for k in ('errors','failures','skipped')), 'Неполный или неуспешный набор тестов'
          note=f'Модульных тестов пройдено: {n}. Подпись совпала. APK: ru.dayplanner.astra, minSdk 29, targetSdk 37; доступ к сети, камере и галерее напрямую не запрашивается.'
          print(note)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: print(note,file=f)
          PY
      - name: Удалить временную копию ключа
        if: always()
        run: rm -f keystore/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-astra-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ github.run_number }}
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
